<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גלריה · בית הכנסת הכיפה</title>
<meta name="description" content="תמונות מאירועי קהילת בית הכנסת העל-עדתי הכיפה, באר שבע.">
<link rel="canonical" href="https://hakipabs.org/gallery.html">
<meta property="og:type" content="website">
<meta property="og:title" content="גלריה · בית הכנסת הכיפה, באר שבע">
<meta property="og:description" content="תמונות מאירועי הקהילה של בית הכנסת העל-עדתי הכיפה.">
<meta property="og:image" content="https://hakipabs.org/images/campaign/exterior.jpg">
<meta property="og:url" content="https://hakipabs.org/gallery.html">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="גלריה · בית הכנסת הכיפה, באר שבע">
<meta name="twitter:image" content="https://hakipabs.org/images/campaign/exterior.jpg">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--paper:#fff;--ink:#1d2430;--muted:#5d6675;--line:#e6e1d6;--navy:#1e3a5f;--navy-2:#2b5283;--sand:#c9a86a;--sand-2:#f1e7cf;--shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,Arial,sans-serif;font-size:17px;line-height:1.6}
.skip{position:absolute;top:-100px;right:16px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:0 0 10px 10px;z-index:100;text-decoration:none}
.skip:focus{top:0}
a{color:var(--navy-2)} a:focus-visible,button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(250,248,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);font-weight:700}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.brand svg{flex:none}
.back{text-decoration:none;font-weight:500;padding:8px 12px;border-radius:8px}
.back:hover{background:var(--sand-2)}
main{padding:40px 0 80px}
h1,h2{font-family:"Frank Ruhl Libre",serif;color:var(--navy);line-height:1.2}
h1{font-size:clamp(28px,4vw,40px);margin:0 0 6px}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.06em;color:#2f7f7a;font-weight:700;margin-bottom:8px}
.muted{color:var(--muted)}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:26px}
.album{display:block;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.album img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.album .cap{padding:12px 16px}
.album .cap strong{display:block;color:var(--navy);font-size:18px}
.album .cap span{font-size:13px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:22px}
.photos button{padding:0;border:0;background:none;cursor:pointer;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.photos img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.toolbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted);margin-top:26px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,16,28,.94);display:flex;align-items:center;justify-content:center;z-index:50}
.lb img{max-width:96vw;max-height:88vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:26px;cursor:pointer}
.lb button:hover{background:rgba(255,255,255,.25)}
.lb .close{top:16px;left:16px}
.lb .prev{right:14px;top:50%;transform:translateY(-50%)}
.lb .next{left:14px;top:50%;transform:translateY(-50%)}
.lb .count{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#c8d3e3;font-size:14px}
footer{border-top:1px solid var(--line);padding:26px 0 44px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן הראשי</a>
<header><div class="wrap nav">
  <a class="brand" href="./">
    <svg viewBox="0 0 64 48" width="44" height="33" aria-hidden="true"><path d="M6 36 C6 18 18 8 32 8 C46 8 58 18 58 36 Z" fill="#1e3a5f"/><rect x="22" y="22" width="20" height="14" rx="2" fill="#c9a86a"/><rect x="2" y="36" width="60" height="5" rx="1.5" fill="#2b5283"/><rect x="8" y="41" width="48" height="2.5" rx="1" fill="#c9a86a"/></svg>
    <span>בית הכנסת הכיפה<small>העל-עדתי, שכונה ה', באר שבע</small></span>
  </a>
  <a class="back" href="./">לדף הבית</a>
</div></header>

<main id="main" class="wrap">
  <span class="eyebrow">הקהילה</span>
  <h1>גלריה</h1>
  <p class="muted" id="intro">תמונות מאירועי הקהילה.</p>

  <div id="albums" class="albums"></div>
  <div id="album" hidden>
    <div class="toolbar">
      <div><h2 id="album-title" style="margin:0"></h2><span class="muted small" id="album-meta"></span></div>
      <a href="gallery.html" id="back-all">כל האלבומים</a>
    </div>
    <div id="photos" class="photos"></div>
  </div>
  <div id="empty" class="empty" hidden>עדיין אין תמונות. בקרוב.</div>
</main>

<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="תצוגת תמונה">
  <button class="close" aria-label="סגירה">×</button>
  <button class="prev" aria-label="התמונה הקודמת">›</button>
  <img id="lb-img" alt="">
  <button class="next" aria-label="התמונה הבאה">‹</button>
  <div class="count" id="lb-count"></div>
</div>

<footer><div class="wrap">בית הכנסת העל-עדתי "הכיפה", באר שבע · <a href="./">לדף הבית</a> · <a href="mailto:vaad@hakipabs.org?subject=%D7%92%D7%9C%D7%A8%D7%99%D7%94">בקשה להסרת תמונה</a></div></footer>

<script>
(async function(){
  const el=id=>document.getElementById(id);
  let data=null;
  try{ const r=await fetch('data/gallery.json',{cache:'no-store'}); data=r.ok?await r.json():null; }catch(e){}
  const albums=(data&&data.albums)||[];
  const slug=new URLSearchParams(location.search).get('album');
  const fmt=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''); return m?`${+m[3]}.${+m[2]}.${m[1]}`:''};
  if(!albums.length){ el('empty').hidden=false; return; }
  const album=slug&&albums.find(a=>a.slug===slug);
  if(!album){
    albums.forEach(a=>{const link=document.createElement('a'); link.className='album'; link.href='gallery.html?album='+encodeURIComponent(a.slug);
      const img=document.createElement('img'); img.src=a.cover; img.alt=a.title; img.loading='lazy'; link.append(img);
      const cap=document.createElement('div'); cap.className='cap'; const t=document.createElement('strong'); t.textContent=a.title; const s=document.createElement('span'); s.textContent=[fmt(a.date), a.count+' תמונות'].filter(Boolean).join(' · '); cap.append(t,s); link.append(cap); el('albums').append(link);});
    return;
  }
  el('albums').hidden=true; el('album').hidden=false; document.title=album.title+' · גלריה · בית הכנסת הכיפה';
  el('album-title').textContent=album.title; el('album-meta').textContent=[fmt(album.date), album.count+' תמונות'].filter(Boolean).join(' · ');
  const photos=album.photos||[]; let idx=0;
  photos.forEach((p,i)=>{const b=document.createElement('button'); b.setAttribute('aria-label','תמונה '+(i+1)); const img=document.createElement('img'); img.src=p.thumb; img.alt=''; img.loading='lazy'; b.append(img); b.addEventListener('click',()=>open(i)); el('photos').append(b);});
  const lb=el('lb'), lbImg=el('lb-img');
  function show(i){ idx=(i+photos.length)%photos.length; lbImg.src=photos[idx].web; el('lb-count').textContent=(idx+1)+' / '+photos.length; }
  function open(i){ show(i); lb.hidden=false; document.body.style.overflow='hidden'; lb.querySelector('.close').focus(); }
  function close(){ lb.hidden=true; document.body.style.overflow=''; }
  lb.querySelector('.close').addEventListener('click',close);
  lb.querySelector('.prev').addEventListener('click',()=>show(idx-1));
  lb.querySelector('.next').addEventListener('click',()=>show(idx+1));
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown',e=>{ if(lb.hidden) return; if(e.key==='Escape') close(); if(e.key==='ArrowRight') show(idx-1); if(e.key==='ArrowLeft') show(idx+1); });
  let sx=null; lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true}); lb.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) show(dx>0?idx-1:idx+1); sx=null; });
})();
</script>

</body>
</html>
