name: Update Shabbat times from the weekly PDF

on:
  push:
    paths:
      - "weekly/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python scripts/update_shabbat.py
      - name: Commit the refreshed data
        run: |
          git config user.name "shabbat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/shabbat.json weekly/latest.pdf
          git diff --cached --quiet || git commit -m "Shabbat times from the weekly sheet [skip ci]"
          git push
