name: Update the yearly candle-lighting table from PDF

on:
  push:
    paths:
      - "yearly/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python scripts/update_yearly.py
      - name: Commit the refreshed data
        run: |
          git config user.name "shabbat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yearly.json yearly/latest.pdf
          git diff --cached --quiet || git commit -m "Yearly candle-lighting table from PDF [skip ci]"
          git push
